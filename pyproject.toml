[project]
name = "dayzero"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dayzero = "dayzero.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dayzero"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
